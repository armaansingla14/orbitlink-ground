services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orbitlink
      POSTGRES_USER: orbitlink
      POSTGRES_PASSWORD: orbitlink
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitlink -d orbitlink"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://orbitlink:orbitlink@db:5432/orbitlink
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
